      },
      "BackendVersion": {
        "description": "Backend build version.",
        "schema": {
          "type": "string"
        }
      },
      "Maturity": {
        "description": "Maturity of the serving implementation.",
        "schema": {
          "enum": [
            "experimental",
            "verified",
            "stable"
          ]
        }
      },
      "Mode": {
        "description": "Backend execution mode.",
        "schema": {
          "enum": [
            "normal",
            "compare",
            "shadow",
            "sandbox"
          ]
        }
      }
    },
    "schemas": {
      "LivenessResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "const": "ok"
          }
        }
      },
      "ReadinessChecks": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "database",
          "redis"
        ],
        "properties": {
          "database": {
            "enum": [
              "ok",
              "failed"
            ]
          },
          "redis": {
            "enum": [
              "ok",
              "disabled",
              "failed"
            ]
          }
        }
      },
      "SchemaStatus": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "latestMigrationMillis",
          "migrationCount"
        ],
        "properties": {
          "latestMigrationMillis": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "migrationCount": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "ReadinessResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status",
          "checks",
          "schema"
        ],
        "properties": {
          "status": {
            "enum": [
              "ready",
              "not_ready"
            ]
          },
          "checks": {
            "$ref": "#/components/schemas/ReadinessChecks"
          },
          "schema": {
            "$ref": "#/components/schemas/SchemaStatus"
          }
        }
      },
      "VersionResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "backend",
          "version",
          "maturity",
          "mode"
        ],
        "properties": {
          "backend": {
            "const": "go"
          },
          "version": {
            "type": "string",
            "minLength": 1
          },
          "maturity": {
            "enum": [
              "experimental",
              "verified",
              "stable"
            ]
          },
          "mode": {
            "enum": [
              "normal",
              "compare",
              "shadow",
              "sandbox"
            ]
          }
        }
      },
      "SettingValue": {
        "oneOf": [
          {
            "type": "string"
          },
          {
            "type": "number"
          },
          {
            "type": "boolean"
          },
          {
            "type": "object",
            "additionalProperties": true
          },
          {
            "type": "array",
            "items": {}
          },
          {
            "type": "null"
          }
        ]
      },
      "SettingsNamespace": {
        "type": "object",
        "additionalProperties": {
          "$ref": "#/components/schemas/SettingValue"
        }
      },
      "PublicSettingsResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "timestamp",
          "data"
        ],
        "properties": {
          "timestamp": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "description": "Unix epoch timestamp in milliseconds."
          },
          "data": {
            "type": "object",
            "additionalProperties": {
              "$ref": "#/components/schemas/SettingsNamespace"
            }
          }
        }
      },
      "ErrorResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "statusCode",
          "statusMessage"
        ],
        "properties": {
          "statusCode": {
            "type": "integer",
            "minimum": 400,
            "maximum": 599
          },
          "statusMessage": {
            "type": "string"
          }
        }
      }
    },
    "responses": {
      "GenericSuccess": {
        "description": "Successful response; payload remains defined by the current Node characterization contract.",
        "content": {
          "application/json": {
            "schema": {}
          }
        }
      },
      "EmptySuccess": {
        "description": "Successful response with no required response body."
      },
      "BinarySuccess": {
        "description": "Binary media response.",
        "content": {
          "application/octet-stream": {
            "schema": {
              "type": "string",
              "contentEncoding": "binary"
            }
          }
        }
      },
      "PngSuccess": {
        "description": "PNG image response.",
        "content": {
          "image/png": {
            "schema": {
              "type": "string",
              "contentEncoding": "binary"
            }
          }
        }
      },
      "EventStream": {
        "description": "Server-sent event stream.",
        "content": {
          "text/event-stream": {
            "schema": {
              "type": "string"
            }
          }
        }
      },
      "Redirect": {
        "description": "OAuth redirect.",
        "headers": {
          "Location": {
            "description": "Redirect target.",
            "schema": {
              "type": "string",
              "format": "uri-reference"
            }
          }
        }
      },
      "Error": {
        "description": "Request failure.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      }
    }
  }
}
