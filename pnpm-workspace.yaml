packages:
  - .
  - packages/*

peerDependencyRules:
  ignoreMissing:
    - '@nuxt/kit'

overrides:
  sharp: 0.35.3

onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - esbuild
  - sharp
  - vue-demi

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  vue-demi: true
