name: Publish Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare image metadata
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Prepare tags
        id: meta
        run: |
          set -euo pipefail

          image="${REGISTRY}/${IMAGE_NAME}"
          image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"

          ref_name="${GITHUB_REF_NAME}"
          ref_tag="$(echo "$ref_name" | tr '[:upper:]' '[:lower:]' | sed -E "s/[^a-z0-9._-]+/-/g; s/^-+|-+$//g")"
          short_sha="${GITHUB_SHA::7}"

          tags=()
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags+=("$ref_tag")
          else
            tags+=("$ref_tag")
            if [ "$ref_name" = "${{ github.event.repository.default_branch }}" ]; then
              tags+=("latest")
            fi
          fi
          tags+=("sha-${short_sha}")

          {
            echo "image=${image}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Docker image metadata"
            echo
            echo "Images:"
            echo
            echo "- Node.js: \`${image}\`"
            echo "- Go: \`${image}-go\`"
            echo
            echo "Tags:"
            printf -- "- \`%s\`\n" "${tags[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.component }} ${{ matrix.arch }} image
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: node
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: Dockerfile
            image_suffix: ''
          - component: node
            arch: arm64
            runner: ubuntu-24.04-arm
            dockerfile: Dockerfile
            image_suffix: ''
          - component: go
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: backend/go/Dockerfile
            image_suffix: '-go'
          - component: go
            arch: arm64
            runner: ubuntu-24.04-arm
            dockerfile: backend/go/Dockerfile
            image_suffix: '-go'
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }} ${{ matrix.arch }} image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}${{ matrix.image_suffix }}
          TAGS: ${{ needs.prepare.outputs.tags }}
          ARCH: ${{ matrix.arch }}
          COMPONENT: ${{ matrix.component }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail

          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            tag_args+=(--tag "${IMAGE}:${tag}-${ARCH}")
          done <<< "$TAGS"

          docker buildx build \
            --platform "linux/${ARCH}" \
            --file "${DOCKERFILE}" \
            --push \
            --cache-from "type=gha,scope=${COMPONENT}-${ARCH}" \
            --cache-to "type=gha,mode=max,scope=${COMPONENT}-${ARCH}" \
            "${tag_args[@]}" \
            .

  manifest:
    name: Publish ${{ matrix.component }} multi-architecture manifest
    needs:
      - prepare
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: node
            image_suffix: ''
          - component: go
            image_suffix: '-go'
    runs-on: ubuntu-24.04

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}${{ matrix.image_suffix }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create \
              --tag "${IMAGE}:${tag}" \
              "${IMAGE}:${tag}-amd64" \
              "${IMAGE}:${tag}-arm64"
            docker buildx imagetools inspect "${IMAGE}:${tag}"
          done <<< "$TAGS"

      - name: Write image summary
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}${{ matrix.image_suffix }}
          TAGS: ${{ needs.prepare.outputs.tags }}
          COMPONENT: ${{ matrix.component }}
        run: |
          {
            echo "## ${COMPONENT} Docker image published"
            echo
            echo "Image:"
            echo
            echo "\`\`\`text"
            echo "$IMAGE"
            echo "\`\`\`"
            echo
            echo "Tags:"
            echo
            echo "\`\`\`text"
            echo "$TAGS"
            echo "\`\`\`"
            echo
            echo "Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
